<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4a6bd">
  <title>Bloomy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bloomy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">Bloomy</div>
      <div class="date" id="today-label"></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" aria-label="Разделы">
      <button class="tab" data-route="today"><span class="tab-ico">🌸</span>Сегодня</button>
      <button class="tab" data-route="water"><span class="tab-ico">💧</span>Вода</button>
      <button class="tab" data-route="shelf"><span class="tab-ico">🪴</span>Полка</button>
      <button class="tab" data-route="more"><span class="tab-ico">✨</span>Ещё</button>
    </nav>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
